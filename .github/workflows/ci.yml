name: CI

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
    inputs:
      infra_probe:
        description: Run a read-only Pro DEV tunnel probe (main branch only)
        type: boolean
        default: false
      workspace_source_export:
        description: Export the exact source revision, tests and fixtures as an Actions artifact
        type: boolean
        default: false
      workspace_source_ref:
        description: Commit SHA, branch or tag to export (empty uses the workflow commit)
        type: string
        default: ""
        required: false

  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  validate_dispatch_request:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 284679775 &&
      startsWith(github.event.comment.body, '/nooshare-ci ')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      infra_probe: ${{ steps.validate.outputs.infra_probe }}
      workspace_source_export: ${{ steps.validate.outputs.workspace_source_export }}
      workspace_source_ref: ${{ steps.validate.outputs.workspace_source_ref }}
    steps:
      - name: Validate owner-issued CI request
        id: validate
        env:
          REQUEST_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          body = os.environ.get("REQUEST_BODY", "")
          prefix = "/nooshare-ci "
          if not body.startswith(prefix):
              raise SystemExit("Rejected: request command prefix is missing")

          try:
              request = json.loads(body[len(prefix):])
          except json.JSONDecodeError as exc:
              raise SystemExit("Rejected: request JSON is invalid") from exc

          if not isinstance(request, dict):
              raise SystemExit("Rejected: request must be a JSON object")

          allowed = {
              "infra_probe",
              "workspace_source_export",
              "workspace_source_ref",
          }
          unknown = set(request) - allowed
          if unknown:
              raise SystemExit("Rejected: unsupported request field(s)")

          infra_probe = request.get("infra_probe", False)
          source_export = request.get("workspace_source_export", False)
          source_ref = request.get("workspace_source_ref", "")

          if type(infra_probe) is not bool or type(source_export) is not bool:
              raise SystemExit("Rejected: task flags must be booleans")
          if not isinstance(source_ref, str):
              raise SystemExit("Rejected: workspace_source_ref must be a string")
          if source_export:
              if not re.fullmatch(r"[0-9a-f]{40}", source_ref):
                  raise SystemExit("Rejected: source export requires an exact 40-character commit SHA")
          elif source_ref:
              raise SystemExit("Rejected: source_ref is only valid when source export is enabled")

          if not infra_probe and not source_export:
              raise SystemExit("Rejected: no CI task was requested")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"infra_probe={str(infra_probe).lower()}\n")
              output.write(f"workspace_source_export={str(source_export).lower()}\n")
              output.write(f"workspace_source_ref={source_ref}\n")

          print("Accepted owner-issued CI request")
          print(f"infra_probe={infra_probe}")
          print(f"workspace_source_export={source_export}")
          print(f"workspace_source_ref_set={bool(source_ref)}")
          PY

  test:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  pro_infrastructure_tunnel:
    name: Pro DEV Tunnel + Strategy Lab read-only audit
    needs: validate_dispatch_request
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.infra_probe == true && github.ref == 'refs/heads/main') ||
        (needs.validate_dispatch_request.result == 'success' && needs.validate_dispatch_request.outputs.infra_probe == 'true')
      )
    runs-on: ubuntu-latest
    environment: ci-probe
    timeout-minutes: 10
    concurrency:
      group: pro-infrastructure-probe-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Install tunnel and read-only probe tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stunnel4 postgresql-client python3-boto3

      # NOOSHARE_INFRA is scoped to this single step. Derived secrets stay in
      # 0600 files under RUNNER_TEMP; never print the JSON, PSK, password or keys.
      - name: Open CI Infrastructure Tunnel and verify read-only access
        env:
          NOOSHARE_INFRA: ${{ secrets.NOOSHARE_INFRA }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import signal
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          import boto3
          from botocore.config import Config

          raw = os.environ.get("NOOSHARE_INFRA", "")
          if not raw:
              raise SystemExit("BLOCKED: ci-probe environment secret NOOSHARE_INFRA is missing")
          try:
              infra = json.loads(raw)
          except Exception:
              raise SystemExit("BLOCKED: NOOSHARE_INFRA is not valid JSON")

          required = (
              "stunnel_host", "stunnel_psk", "pg_user", "pg_password",
              "pg_db", "rustfs_access_key", "rustfs_secret_key", "rustfs_bucket",
          )
          values = {}
          for name in required:
              value = infra.get(name)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit("BLOCKED: NOOSHARE_INFRA missing field " + name)
              values[name] = value.strip()

          work_dir = Path(tempfile.mkdtemp(
              prefix="pro-ci-probe-", dir=os.environ["RUNNER_TEMP"]
          ))
          os.chmod(work_dir, 0o700)
          psk_path = work_dir / "k-ci.psk"
          config_path = work_dir / "stunnel.conf"
          pid_path = work_dir / "stunnel.pid"
          psk_path.write_text(values["stunnel_psk"] + "\n", encoding="utf-8")
          os.chmod(psk_path, 0o600)

          config = "\n".join([
              "pid = " + str(pid_path),
              "",
              "[pg]",
              "client = yes",
              "accept = 127.0.0.1:15432",
              "connect = " + values["stunnel_host"] + ":27002",
              "sni = pg.noos.com",
              "ciphers = PSK",
              "PSKsecrets = " + str(psk_path),
              "",
              "[rustfs]",
              "client = yes",
              "accept = 127.0.0.1:15500",
              "connect = " + values["stunnel_host"] + ":27002",
              "sni = rustfs.noos.com",
              "ciphers = PSK",
              "PSKsecrets = " + str(psk_path),
              "",
          ])
          config_path.write_text(config, encoding="utf-8")
          os.chmod(config_path, 0o600)

          try:
              stunnel = shutil.which("stunnel") or shutil.which("stunnel4")
              if not stunnel:
                  raise SystemExit("BLOCKED: stunnel executable not found")
              subprocess.run(
                  [stunnel, str(config_path)],
                  check=True,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  timeout=10,
              )

              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  listeners = subprocess.run(
                      ["ss", "-ltn"], check=True, capture_output=True, text=True
                  ).stdout
                  if (
                      pid_path.is_file()
                      and "127.0.0.1:15432" in listeners
                      and "127.0.0.1:15500" in listeners
                  ):
                      break
                  time.sleep(1)
              else:
                  raise SystemExit("FAIL: stunnel listeners did not become ready")

              pg_env = os.environ.copy()
              pg_env.update({
                  "PGPASSWORD": values["pg_password"],
                  "PGSSLMODE": "disable",
              })

              try:
                  s3 = boto3.client(
                      "s3",
                      endpoint_url="http://127.0.0.1:15500",
                      aws_access_key_id=values["rustfs_access_key"],
                      aws_secret_access_key=values["rustfs_secret_key"],
                      region_name="us-east-1",
                      config=Config(
                          signature_version="s3v4",
                          s3={"addressing_style": "path"},
                          connect_timeout=5,
                          read_timeout=10,
                          retries={"max_attempts": 1},
                      ),
                  )
                  s3.head_bucket(Bucket=values["rustfs_bucket"])
              except Exception as exc:
                  raise SystemExit(
                      "FAIL: RustFS bucket probe failed (" + type(exc).__name__ + ")"
                  )

              # Read DEV Strategy Lab metadata only. Never select business rows or payload values.
              if values["pg_db"] != "nooshare_dev":
                  raise SystemExit("BLOCKED: Strategy Lab audit is restricted to nooshare_dev")

              audit_sql = r"""
              BEGIN TRANSACTION READ ONLY;
              SET LOCAL statement_timeout = '30s';
              SELECT jsonb_pretty(jsonb_build_object(
                'database', current_database(),
                'current_user', current_user,
                'server_version', current_setting('server_version'),
                'transaction_read_only', current_setting('transaction_read_only'),
                'role_privileges', (
                  SELECT jsonb_build_object(
                    'superuser', r.rolsuper,
                    'create_role', r.rolcreaterole,
                    'create_database', r.rolcreatedb,
                    'replication', r.rolreplication,
                    'bypass_rls', r.rolbypassrls
                  )
                  FROM pg_roles r WHERE r.rolname = current_user
                ),
                'database_privileges', jsonb_build_object(
                  'connect', has_database_privilege(current_user, current_database(), 'CONNECT'),
                  'create', has_database_privilege(current_user, current_database(), 'CREATE'),
                  'temporary', has_database_privilege(current_user, current_database(), 'TEMP')
                ),
                'strategy_lab_schema_privileges', CASE
                  WHEN to_regnamespace('strategy_lab') IS NULL THEN NULL
                  ELSE jsonb_build_object(
                    'usage', has_schema_privilege(current_user, 'strategy_lab', 'USAGE'),
                    'create', has_schema_privilege(current_user, 'strategy_lab', 'CREATE')
                  )
                END,
                'schema_exists', to_regnamespace('strategy_lab') IS NOT NULL,
                'tables', (
                  SELECT COALESCE(jsonb_agg(jsonb_build_object(
                    'name', c.relname,
                    'kind', c.relkind,
                    'estimated_live_rows', COALESCE(s.n_live_tup, 0),
                    'estimated_dead_rows', COALESCE(s.n_dead_tup, 0),
                    'total_relation_bytes', pg_total_relation_size(c.oid)
                  ) ORDER BY c.relname), '[]'::jsonb)
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  LEFT JOIN pg_stat_user_tables s
                    ON s.relid = c.oid
                  WHERE n.nspname = 'strategy_lab'
                    AND c.relkind IN ('r', 'p')
                ),
                'exact_table_counts', '[]'::jsonb,
                'table_privileges', (
                  SELECT COALESCE(jsonb_agg(jsonb_build_object(
                    'table', c.relname,
                    'select', has_table_privilege(current_user, c.oid, 'SELECT'),
                    'insert', has_table_privilege(current_user, c.oid, 'INSERT'),
                    'update', has_table_privilege(current_user, c.oid, 'UPDATE'),
                    'delete', has_table_privilege(current_user, c.oid, 'DELETE'),
                    'truncate', has_table_privilege(current_user, c.oid, 'TRUNCATE'),
                    'references', has_table_privilege(current_user, c.oid, 'REFERENCES'),
                    'trigger', has_table_privilege(current_user, c.oid, 'TRIGGER')
                  ) ORDER BY c.relname), '[]'::jsonb)
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'strategy_lab'
                    AND c.relkind IN ('r', 'p')
                ),
                'columns', (
                  SELECT COALESCE(jsonb_agg(jsonb_build_object(
                    'table', c.relname,
                    'ordinal', a.attnum,
                    'column', a.attname,
                    'data_type', format_type(a.atttypid, a.atttypmod),
                    'nullable', NOT a.attnotnull,
                    'default', pg_get_expr(d.adbin, d.adrelid)
                  ) ORDER BY c.relname, a.attnum), '[]'::jsonb)
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  JOIN pg_attribute a ON a.attrelid = c.oid
                  LEFT JOIN pg_attrdef d ON d.adrelid = c.oid AND d.adnum = a.attnum
                  WHERE n.nspname = 'strategy_lab'
                    AND c.relkind IN ('r', 'p')
                    AND a.attnum > 0
                    AND NOT a.attisdropped
                ),
                'constraints', (
                  SELECT COALESCE(jsonb_agg(jsonb_build_object(
                    'table', c.relname,
                    'name', con.conname,
                    'type', con.contype,
                    'validated', con.convalidated,
                    'definition', pg_get_constraintdef(con.oid)
                  ) ORDER BY c.relname, con.conname), '[]'::jsonb)
                  FROM pg_constraint con
                  JOIN pg_class c ON c.oid = con.conrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'strategy_lab'
                ),
                'indexes', (
                  SELECT COALESCE(jsonb_agg(jsonb_build_object(
                    'table', t.relname,
                    'name', i.relname,
                    'valid', x.indisvalid,
                    'unique', x.indisunique,
                    'definition', pg_get_indexdef(x.indexrelid)
                  ) ORDER BY t.relname, i.relname), '[]'::jsonb)
                  FROM pg_index x
                  JOIN pg_class t ON t.oid = x.indrelid
                  JOIN pg_class i ON i.oid = x.indexrelid
                  JOIN pg_namespace n ON n.oid = t.relnamespace
                  WHERE n.nspname = 'strategy_lab'
                ),
                'migration_marker_tables', (
                  SELECT COALESCE(jsonb_agg(c.relname ORDER BY c.relname), '[]'::jsonb)
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'strategy_lab'
                    AND c.relkind IN ('r', 'p')
                    AND (
                      c.relname ILIKE '%migration%'
                      OR c.relname ILIKE '%version%'
                      OR c.relname = 'alembic_version'
                    )
                ),
                'migration_checks', jsonb_build_object(
                  'v02_expected_tables_present', (
                    SELECT count(*) = 11
                    FROM unnest(ARRAY[
                      'experiment_variant', 'universe_snapshot', 'universe_member',
                      'run_signal', 'run_order', 'run_fill', 'run_trade',
                      'run_trade_fill', 'run_equity_point', 'run_summary',
                      'run_package'
                    ]::text[]) AS t(name)
                    WHERE to_regclass('strategy_lab.' || quote_ident(t.name)) IS NOT NULL
                  ),
                  'v03_exit_event_table_present', to_regclass('strategy_lab.run_exit_event') IS NOT NULL,
                  'v03_order_exit_event_column_present', EXISTS (
                    SELECT 1 FROM pg_attribute a
                    JOIN pg_class c ON c.oid = a.attrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'strategy_lab'
                      AND c.relname = 'run_order'
                      AND a.attname = 'exit_event_id'
                      AND a.attnum > 0 AND NOT a.attisdropped
                  ),
                  'v03_order_decision_reason_column_present', EXISTS (
                    SELECT 1 FROM pg_attribute a
                    JOIN pg_class c ON c.oid = a.attrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'strategy_lab'
                      AND c.relname = 'run_order'
                      AND a.attname = 'decision_reason'
                      AND a.attnum > 0 AND NOT a.attisdropped
                  ),
                  'v04_order_trade_id_column_present', EXISTS (
                    SELECT 1 FROM pg_attribute a
                    JOIN pg_class c ON c.oid = a.attrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'strategy_lab'
                      AND c.relname = 'run_order'
                      AND a.attname = 'trade_id'
                      AND a.attnum > 0 AND NOT a.attisdropped
                  ),
                  'v04_exit_event_decision_date_type', (
                    SELECT format_type(a.atttypid, a.atttypmod)
                    FROM pg_attribute a
                    JOIN pg_class c ON c.oid = a.attrelid
                    JOIN pg_namespace n ON n.oid = c.relnamespace
                    WHERE n.nspname = 'strategy_lab'
                      AND c.relname = 'run_exit_event'
                      AND a.attname = 'decision_date'
                      AND a.attnum > 0 AND NOT a.attisdropped
                    LIMIT 1
                  )
                ),
                'v04_required_constraints', (
                  SELECT COALESCE(jsonb_object_agg(
                    wanted.name,
                    CASE WHEN con.oid IS NULL THEN jsonb_build_object('present', false)
                         ELSE jsonb_build_object('present', true, 'validated', con.convalidated,
                                                 'definition', pg_get_constraintdef(con.oid))
                    END
                  ), '{}'::jsonb)
                  FROM unnest(ARRAY[
                    'fk_run_exit_event_run_trade',
                    'fk_run_order_run_trade',
                    'fk_run_order_run_exit_event',
                    'chk_run_order_exit_event_consistency'
                  ]::text[]) AS wanted(name)
                  LEFT JOIN pg_constraint con
                    ON con.conname = wanted.name
                   AND con.connamespace = to_regnamespace('strategy_lab')
                ),
                'v04_required_indexes', (
                  SELECT COALESCE(jsonb_object_agg(
                    wanted.name,
                    CASE WHEN idx.indexrelid IS NULL THEN jsonb_build_object('present', false)
                         ELSE jsonb_build_object('present', true, 'valid', idx.indisvalid,
                                                 'unique', idx.indisunique)
                    END
                  ), '{}'::jsonb)
                  FROM unnest(ARRAY[
                    'uq_run_exit_event_run_id_event_id',
                    'idx_run_order_trade_id',
                    'idx_run_exit_event_trade_id'
                  ]::text[]) AS wanted(name)
                  LEFT JOIN pg_class ic
                    ON ic.relname = wanted.name
                   AND ic.relnamespace = to_regnamespace('strategy_lab')
                  LEFT JOIN pg_index idx ON idx.indexrelid = ic.oid
                )
              ));

              DO $strategy_lab_exact_counts$
              DECLARE
                target_table text;
                row_total bigint;
                exact_counts jsonb := '[]'::jsonb;
              BEGIN
                FOREACH target_table IN ARRAY ARRAY[
                  'experiment', 'experiment_variant', 'experiment_run',
                  'universe_snapshot', 'universe_member', 'signal',
                  'run_signal', 'run_trade', 'run_exit_event', 'run_order',
                  'run_fill', 'run_trade_fill', 'run_equity_point',
                  'run_summary', 'run_package'
                ]::text[]
                LOOP
                  IF to_regclass(format('%I.%I', 'strategy_lab', target_table)) IS NOT NULL THEN
                    EXECUTE format(
                      'SELECT count(*) FROM %I.%I',
                      'strategy_lab',
                      target_table
                    ) INTO row_total;
                    exact_counts := exact_counts || jsonb_build_array(
                      jsonb_build_object('table', target_table, 'row_count', row_total)
                    );
                  END IF;
                END LOOP;

                RAISE NOTICE 'STRATEGY_LAB_EXACT_TABLE_COUNTS=%', exact_counts::text;
              END
              $strategy_lab_exact_counts$;

              DO $strategy_lab_consistency$
              DECLARE
                consistency_report jsonb;
              BEGIN
                SELECT jsonb_build_object(
                  'schema_version', 1,
                  'status_distributions', jsonb_build_object(
                    'experiment_run', (
                      SELECT COALESCE(jsonb_object_agg(status, row_count), '{}'::jsonb)
                      FROM (
                        SELECT status, count(*)::bigint AS row_count
                        FROM strategy_lab.experiment_run GROUP BY status
                      ) q
                    ),
                    'run_trade', (
                      SELECT COALESCE(jsonb_object_agg(status, row_count), '{}'::jsonb)
                      FROM (
                        SELECT status, count(*)::bigint AS row_count
                        FROM strategy_lab.run_trade GROUP BY status
                      ) q
                    ),
                    'run_order_side_status', (
                      SELECT COALESCE(jsonb_object_agg(side || ':' || status, row_count), '{}'::jsonb)
                      FROM (
                        SELECT side, status, count(*)::bigint AS row_count
                        FROM strategy_lab.run_order GROUP BY side, status
                      ) q
                    ),
                    'run_exit_event', (
                      SELECT COALESCE(jsonb_object_agg(status, row_count), '{}'::jsonb)
                      FROM (
                        SELECT status, count(*)::bigint AS row_count
                        FROM strategy_lab.run_exit_event GROUP BY status
                      ) q
                    ),
                    'run_package_schema_version', (
                      SELECT COALESCE(jsonb_object_agg(schema_version::text, row_count), '{}'::jsonb)
                      FROM (
                        SELECT schema_version, count(*)::bigint AS row_count
                        FROM strategy_lab.run_package GROUP BY schema_version
                      ) q
                    )
                  ),
                  'checks', jsonb_build_object(
                    'trades_without_initial_signal', (
                      SELECT count(*) FROM strategy_lab.run_trade
                      WHERE initial_signal_id IS NULL
                    ),
                    'trades_initial_signal_instrument_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade t
                      JOIN strategy_lab.run_signal s
                        ON s.run_id = t.run_id AND s.signal_id = t.initial_signal_id
                      WHERE t.exchange IS DISTINCT FROM s.exchange
                         OR t.canonical_id IS DISTINCT FROM s.canonical_id
                    ),
                    'orders_without_trade_by_side', (
                      SELECT COALESCE(jsonb_object_agg(side, row_count), '{}'::jsonb)
                      FROM (
                        SELECT side, count(*)::bigint AS row_count
                        FROM strategy_lab.run_order
                        WHERE trade_id IS NULL
                        GROUP BY side
                      ) q
                    ),
                    'orders_without_signal_by_side', (
                      SELECT COALESCE(jsonb_object_agg(side, row_count), '{}'::jsonb)
                      FROM (
                        SELECT side, count(*)::bigint AS row_count
                        FROM strategy_lab.run_order
                        WHERE signal_id IS NULL
                        GROUP BY side
                      ) q
                    ),
                    'orders_signal_instrument_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_order o
                      JOIN strategy_lab.run_signal s
                        ON s.run_id = o.run_id AND s.signal_id = o.signal_id
                      WHERE o.exchange IS DISTINCT FROM s.exchange
                         OR o.canonical_id IS DISTINCT FROM s.canonical_id
                    ),
                    'orders_trade_instrument_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_order o
                      JOIN strategy_lab.run_trade t
                        ON t.run_id = o.run_id AND t.trade_id = o.trade_id
                      WHERE o.exchange IS DISTINCT FROM t.exchange
                         OR o.canonical_id IS DISTINCT FROM t.canonical_id
                    ),
                    'orders_with_dangling_exit_event', (
                      SELECT count(*)
                      FROM strategy_lab.run_order o
                      LEFT JOIN strategy_lab.run_exit_event e
                        ON e.run_id = o.run_id AND e.exit_event_id = o.exit_event_id
                      WHERE o.exit_event_id IS NOT NULL AND e.exit_event_id IS NULL
                    ),
                    'orders_exit_event_trade_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_order o
                      JOIN strategy_lab.run_exit_event e
                        ON e.run_id = o.run_id AND e.exit_event_id = o.exit_event_id
                      WHERE o.trade_id IS DISTINCT FROM e.trade_id
                    ),
                    'orders_exit_event_wrong_side_or_missing_trade', (
                      SELECT count(*)
                      FROM strategy_lab.run_order
                      WHERE exit_event_id IS NOT NULL
                        AND (side <> 'SELL' OR trade_id IS NULL)
                    ),
                    'terminal_exit_events_without_sell_order', (
                      SELECT count(*)
                      FROM strategy_lab.run_exit_event e
                      WHERE e.status IN ('executed', 'partial', 'complete')
                        AND NOT EXISTS (
                          SELECT 1
                          FROM strategy_lab.run_order o
                          WHERE o.run_id = e.run_id
                            AND o.exit_event_id = e.exit_event_id
                            AND o.side = 'SELL'
                        )
                    ),
                    'orders_filled_qty_vs_fill_sum_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_order o
                      LEFT JOIN (
                        SELECT run_id, order_id, sum(filled_qty)::bigint AS fill_qty
                        FROM strategy_lab.run_fill
                        GROUP BY run_id, order_id
                      ) f ON f.run_id = o.run_id AND f.order_id = o.order_id
                      WHERE o.filled_qty <> COALESCE(f.fill_qty, 0)
                    ),
                    'orders_fills_exceed_requested_qty', (
                      SELECT count(*)
                      FROM strategy_lab.run_order o
                      JOIN (
                        SELECT run_id, order_id, sum(filled_qty)::bigint AS fill_qty
                        FROM strategy_lab.run_fill
                        GROUP BY run_id, order_id
                      ) f ON f.run_id = o.run_id AND f.order_id = o.order_id
                      WHERE f.fill_qty > o.requested_qty
                    ),
                    'fills_without_trade_allocation', (
                      SELECT count(*)
                      FROM strategy_lab.run_fill f
                      WHERE NOT EXISTS (
                        SELECT 1 FROM strategy_lab.run_trade_fill a
                        WHERE a.run_id = f.run_id AND a.fill_id = f.fill_id
                      )
                    ),
                    'fills_underallocated_qty', (
                      SELECT count(*)
                      FROM (
                        SELECT f.run_id, f.fill_id, f.filled_qty,
                               COALESCE(sum(a.allocated_qty), 0)::bigint AS allocated_qty
                        FROM strategy_lab.run_fill f
                        LEFT JOIN strategy_lab.run_trade_fill a
                          ON a.run_id = f.run_id AND a.fill_id = f.fill_id
                        GROUP BY f.run_id, f.fill_id, f.filled_qty
                        HAVING COALESCE(sum(a.allocated_qty), 0) < f.filled_qty
                      ) q
                    ),
                    'fills_overallocated_qty', (
                      SELECT count(*)
                      FROM (
                        SELECT f.run_id, f.fill_id, f.filled_qty,
                               COALESCE(sum(a.allocated_qty), 0)::bigint AS allocated_qty
                        FROM strategy_lab.run_fill f
                        LEFT JOIN strategy_lab.run_trade_fill a
                          ON a.run_id = f.run_id AND a.fill_id = f.fill_id
                        GROUP BY f.run_id, f.fill_id, f.filled_qty
                        HAVING COALESCE(sum(a.allocated_qty), 0) > f.filled_qty
                      ) q
                    ),
                    'allocations_role_side_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade_fill a
                      JOIN strategy_lab.run_fill f
                        ON f.run_id = a.run_id AND f.fill_id = a.fill_id
                      JOIN strategy_lab.run_order o
                        ON o.run_id = f.run_id AND o.order_id = f.order_id
                      WHERE (a.allocation_role = 'ENTRY' AND o.side <> 'BUY')
                         OR (a.allocation_role = 'EXIT' AND o.side <> 'SELL')
                    ),
                    'allocations_trade_instrument_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade_fill a
                      JOIN strategy_lab.run_trade t
                        ON t.run_id = a.run_id AND t.trade_id = a.trade_id
                      JOIN strategy_lab.run_fill f
                        ON f.run_id = a.run_id AND f.fill_id = a.fill_id
                      JOIN strategy_lab.run_order o
                        ON o.run_id = f.run_id AND o.order_id = f.order_id
                      WHERE t.exchange IS DISTINCT FROM o.exchange
                         OR t.canonical_id IS DISTINCT FROM o.canonical_id
                    ),
                    'trade_entry_qty_vs_allocations_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade t
                      LEFT JOIN (
                        SELECT run_id, trade_id,
                               sum(allocated_qty) FILTER (WHERE allocation_role = 'ENTRY')::bigint AS entry_allocated_qty
                        FROM strategy_lab.run_trade_fill
                        GROUP BY run_id, trade_id
                      ) a ON a.run_id = t.run_id AND a.trade_id = t.trade_id
                      WHERE t.entry_qty <> COALESCE(a.entry_allocated_qty, 0)
                    ),
                    'trade_exit_qty_vs_allocations_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade t
                      LEFT JOIN (
                        SELECT run_id, trade_id,
                               sum(allocated_qty) FILTER (WHERE allocation_role = 'EXIT')::bigint AS exit_allocated_qty
                        FROM strategy_lab.run_trade_fill
                        GROUP BY run_id, trade_id
                      ) a ON a.run_id = t.run_id AND a.trade_id = t.trade_id
                      WHERE t.exit_qty <> COALESCE(a.exit_allocated_qty, 0)
                    ),
                    'closed_trades_exit_qty_differs_from_entry_qty', (
                      SELECT count(*) FROM strategy_lab.run_trade
                      WHERE status = 'CLOSED' AND exit_qty <> entry_qty
                    ),
                    'closed_trades_without_closed_date', (
                      SELECT count(*) FROM strategy_lab.run_trade
                      WHERE status = 'CLOSED' AND closed_date IS NULL
                    ),
                    'nonclosed_trades_with_closed_date', (
                      SELECT count(*) FROM strategy_lab.run_trade
                      WHERE status <> 'CLOSED' AND closed_date IS NOT NULL
                    ),
                    'trades_exit_qty_exceeds_entry_qty', (
                      SELECT count(*) FROM strategy_lab.run_trade
                      WHERE exit_qty > entry_qty
                    ),
                    'exit_event_decision_date_outside_yyyymmdd_range', (
                      SELECT count(*) FROM strategy_lab.run_exit_event
                      WHERE decision_date < 19000101 OR decision_date > 21001231
                    ),
                    'fills_before_order_date', (
                      SELECT count(*)
                      FROM strategy_lab.run_fill f
                      JOIN strategy_lab.run_order o
                        ON o.run_id = f.run_id AND o.order_id = f.order_id
                      WHERE f.fill_date < o.order_date
                    ),
                    'fills_before_order_decision_date', (
                      SELECT count(*)
                      FROM strategy_lab.run_fill f
                      JOIN strategy_lab.run_order o
                        ON o.run_id = f.run_id AND o.order_id = f.order_id
                      WHERE f.fill_date < o.decision_date
                    ),
                    'trades_opened_date_vs_first_entry_fill_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade t
                      JOIN (
                        SELECT a.run_id, a.trade_id, min(f.fill_date) AS first_entry_fill_date
                        FROM strategy_lab.run_trade_fill a
                        JOIN strategy_lab.run_fill f
                          ON f.run_id = a.run_id AND f.fill_id = a.fill_id
                        WHERE a.allocation_role = 'ENTRY'
                        GROUP BY a.run_id, a.trade_id
                      ) x ON x.run_id = t.run_id AND x.trade_id = t.trade_id
                      WHERE t.opened_date <> x.first_entry_fill_date
                    ),
                    'closed_trades_closed_date_vs_last_exit_fill_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_trade t
                      JOIN (
                        SELECT a.run_id, a.trade_id, max(f.fill_date) AS last_exit_fill_date
                        FROM strategy_lab.run_trade_fill a
                        JOIN strategy_lab.run_fill f
                          ON f.run_id = a.run_id AND f.fill_id = a.fill_id
                        WHERE a.allocation_role = 'EXIT'
                        GROUP BY a.run_id, a.trade_id
                      ) x ON x.run_id = t.run_id AND x.trade_id = t.trade_id
                      WHERE t.status = 'CLOSED'
                        AND t.closed_date IS DISTINCT FROM x.last_exit_fill_date
                    ),
                    'run_summary_count_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_summary s
                      WHERE s.n_signals <> (
                          SELECT count(*) FROM strategy_lab.run_signal x WHERE x.run_id = s.run_id
                        )
                         OR s.n_orders <> (
                          SELECT count(*) FROM strategy_lab.run_order x WHERE x.run_id = s.run_id
                        )
                         OR s.n_fills <> (
                          SELECT count(*) FROM strategy_lab.run_fill x WHERE x.run_id = s.run_id
                        )
                         OR s.n_trades <> (
                          SELECT count(*) FROM strategy_lab.run_trade x WHERE x.run_id = s.run_id
                        )
                    ),
                    'runs_missing_summary', (
                      SELECT count(*)
                      FROM strategy_lab.experiment_run r
                      WHERE NOT EXISTS (
                        SELECT 1 FROM strategy_lab.run_summary s WHERE s.run_id = r.run_id
                      )
                    ),
                    'runs_missing_package', (
                      SELECT count(*)
                      FROM strategy_lab.experiment_run r
                      WHERE NOT EXISTS (
                        SELECT 1 FROM strategy_lab.run_package p WHERE p.run_id = r.run_id
                      )
                    ),
                    'summary_missing_package', (
                      SELECT count(*)
                      FROM strategy_lab.run_summary s
                      WHERE NOT EXISTS (
                        SELECT 1 FROM strategy_lab.run_package p WHERE p.run_id = s.run_id
                      )
                    ),
                    'package_missing_summary', (
                      SELECT count(*)
                      FROM strategy_lab.run_package p
                      WHERE NOT EXISTS (
                        SELECT 1 FROM strategy_lab.run_summary s WHERE s.run_id = p.run_id
                      )
                    ),
                    'equity_total_asset_arithmetic_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_equity_point
                      WHERE abs(total_asset - (cash + market_value)) > 0.00000001
                    ),
                    'summary_vs_last_equity_return_mismatch', (
                      SELECT count(*)
                      FROM strategy_lab.run_summary s
                      JOIN LATERAL (
                        SELECT cumulative_return
                        FROM strategy_lab.run_equity_point e
                        WHERE e.run_id = s.run_id
                        ORDER BY e.date DESC
                        LIMIT 1
                      ) e ON true
                      WHERE s.total_return IS NOT NULL
                        AND abs(s.total_return - e.cumulative_return) > 0.00000001
                    )
                  )
                ) INTO consistency_report;

                RAISE NOTICE 'STRATEGY_LAB_CONSISTENCY=%', consistency_report::text;
              END
              $strategy_lab_consistency$;

              DO $strategy_lab_diagnostic_slices$
              DECLARE
                diagnostics_report jsonb;
              BEGIN
                SELECT jsonb_build_object(
                  'schema_version', 1,
                  'runs_by_version', (
                    SELECT COALESCE(jsonb_agg(to_jsonb(q) ORDER BY q.run_count DESC), '[]'::jsonb)
                    FROM (
                      SELECT r.status,
                             COALESCE(r.strategy_commit, 'unknown') AS strategy_commit,
                             COALESCE(r.backtest_commit, 'unknown') AS backtest_commit,
                             count(*)::bigint AS run_count,
                             count(*) FILTER (WHERE s.run_id IS NULL)::bigint AS missing_summary_count,
                             count(*) FILTER (WHERE p.run_id IS NULL)::bigint AS missing_package_count,
                             count(*) FILTER (WHERE p.schema_version = 1)::bigint AS package_schema_v1_count,
                             count(*) FILTER (WHERE p.schema_version = 2)::bigint AS package_schema_v2_count,
                             count(*) FILTER (
                               WHERE p.package #>> '{backtest_result,schema_version}' = '2'
                             )::bigint AS backtest_result_schema_v2_count
                      FROM strategy_lab.experiment_run r
                      LEFT JOIN strategy_lab.run_summary s ON s.run_id = r.run_id
                      LEFT JOIN strategy_lab.run_package p ON p.run_id = r.run_id
                      GROUP BY r.status, r.strategy_commit, r.backtest_commit
                    ) q
                  ),
                  'runs_by_month', (
                    SELECT COALESCE(
                      jsonb_agg(to_jsonb(q) ORDER BY q.run_month, q.status),
                      '[]'::jsonb
                    )
                    FROM (
                      SELECT date_trunc('month', r.created_at)::date AS run_month,
                             r.status,
                             count(*)::bigint AS run_count,
                             count(*) FILTER (WHERE s.run_id IS NULL)::bigint AS missing_summary_count,
                             count(*) FILTER (WHERE p.run_id IS NULL)::bigint AS missing_package_count
                      FROM strategy_lab.experiment_run r
                      LEFT JOIN strategy_lab.run_summary s ON s.run_id = r.run_id
                      LEFT JOIN strategy_lab.run_package p ON p.run_id = r.run_id
                      GROUP BY date_trunc('month', r.created_at)::date, r.status
                    ) q
                  ),
                  'trade_signal_by_version', (
                    WITH entry_trace AS (
                      SELECT t.run_id, t.trade_id,
                             count(a.fill_id)::bigint AS entry_allocation_count,
                             count(o.order_id)::bigint AS entry_order_count,
                             count(o.order_id) FILTER (
                               WHERE o.signal_id IS NOT NULL
                             )::bigint AS entry_orders_with_signal_count,
                             count(o.order_id) FILTER (
                               WHERE o.signal_id IS NOT NULL AND s.signal_id IS NULL
                             )::bigint AS entry_orders_with_unresolved_signal_count,
                             count(o.order_id) FILTER (
                               WHERE o.order_id IS NOT NULL
                                 AND (o.exchange IS DISTINCT FROM t.exchange
                                   OR o.canonical_id IS DISTINCT FROM t.canonical_id)
                             )::bigint AS entry_order_security_mismatch_count,
                             count(o.order_id) FILTER (
                               WHERE o.signal_id = t.initial_signal_id
                                 AND o.signal_id IS NOT NULL
                             )::bigint AS entry_orders_matching_initial_signal_count
                      FROM strategy_lab.run_trade t
                      LEFT JOIN strategy_lab.run_trade_fill a
                        ON a.run_id = t.run_id
                       AND a.trade_id = t.trade_id
                       AND a.allocation_role = 'ENTRY'
                      LEFT JOIN strategy_lab.run_fill f
                        ON f.run_id = a.run_id AND f.fill_id = a.fill_id
                      LEFT JOIN strategy_lab.run_order o
                        ON o.run_id = f.run_id AND o.order_id = f.order_id
                      LEFT JOIN strategy_lab.run_signal s
                        ON s.run_id = o.run_id AND s.signal_id = o.signal_id
                      GROUP BY t.run_id, t.trade_id
                    )
                    SELECT COALESCE(jsonb_agg(to_jsonb(q)), '[]'::jsonb)
                    FROM (
                      SELECT COALESCE(r.strategy_commit, 'unknown') AS strategy_commit,
                             COALESCE(r.backtest_commit, 'unknown') AS backtest_commit,
                             count(*)::bigint AS trade_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NULL
                             )::bigint AS missing_initial_signal_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NULL
                                 AND COALESCE(e.entry_order_count, 0) = 0
                             )::bigint AS missing_signal_and_entry_order_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NULL
                                 AND COALESCE(e.entry_order_count, 0) > 0
                                 AND COALESCE(e.entry_orders_with_signal_count, 0) = 0
                             )::bigint AS missing_signal_and_all_entry_orders_without_signal_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NULL
                                 AND COALESCE(e.entry_orders_with_signal_count, 0) > 0
                             )::bigint AS missing_signal_but_entry_order_has_signal_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NULL
                                 AND COALESCE(e.entry_orders_with_unresolved_signal_count, 0) > 0
                             )::bigint AS entry_order_signal_not_found_in_run_signal_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NULL
                                 AND COALESCE(e.entry_order_security_mismatch_count, 0) > 0
                             )::bigint AS entry_order_security_mismatch_count,
                             count(*) FILTER (
                               WHERE t.initial_signal_id IS NOT NULL
                                 AND COALESCE(e.entry_orders_matching_initial_signal_count, 0) = 0
                             )::bigint AS nonnull_initial_signal_not_found_on_entry_order_count
                      FROM strategy_lab.run_trade t
                      JOIN strategy_lab.experiment_run r ON r.run_id = t.run_id
                      LEFT JOIN entry_trace e ON e.run_id = t.run_id AND e.trade_id = t.trade_id
                      GROUP BY r.strategy_commit, r.backtest_commit
                    ) q
                  ),
                  'missing_sell_trade_by_version', (
                    WITH sell_trace AS (
                      SELECT o.run_id, o.order_id,
                             count(DISTINCT f.fill_id)::bigint AS fill_count,
                             count(DISTINCT a.fill_id)::bigint AS allocated_fill_count,
                             count(DISTINCT a.trade_id)::bigint AS allocated_trade_count,
                             count(DISTINCT a.fill_id) FILTER (
                               WHERE t.exchange IS DISTINCT FROM o.exchange
                                  OR t.canonical_id IS DISTINCT FROM o.canonical_id
                             )::bigint AS allocated_security_mismatch_count
                      FROM strategy_lab.run_order o
                      LEFT JOIN strategy_lab.run_fill f
                        ON f.run_id = o.run_id AND f.order_id = o.order_id
                      LEFT JOIN strategy_lab.run_trade_fill a
                        ON a.run_id = f.run_id AND a.fill_id = f.fill_id
                      LEFT JOIN strategy_lab.run_trade t
                        ON t.run_id = a.run_id AND t.trade_id = a.trade_id
                      WHERE o.side = 'SELL' AND o.trade_id IS NULL
                      GROUP BY o.run_id, o.order_id
                    )
                    SELECT COALESCE(jsonb_agg(to_jsonb(q)), '[]'::jsonb)
                    FROM (
                      SELECT COALESCE(r.strategy_commit, 'unknown') AS strategy_commit,
                             COALESCE(r.backtest_commit, 'unknown') AS backtest_commit,
                             count(*)::bigint AS sell_orders_missing_trade_id,
                             count(*) FILTER (WHERE o.exit_event_id IS NOT NULL)::bigint AS with_exit_event_count,
                             count(*) FILTER (WHERE o.exit_event_id IS NULL)::bigint AS without_exit_event_count,
                             count(*) FILTER (WHERE s.fill_count > 0)::bigint AS with_fill_count,
                             count(*) FILTER (WHERE s.fill_count = 0)::bigint AS without_fill_count,
                             count(*) FILTER (WHERE s.allocated_trade_count = 1)::bigint AS exactly_one_allocated_trade_count,
                             count(*) FILTER (WHERE s.allocated_trade_count = 0)::bigint AS without_allocated_trade_count,
                             count(*) FILTER (WHERE s.allocated_trade_count > 1)::bigint AS multiple_allocated_trades_count,
                             sum(s.allocated_security_mismatch_count)::bigint AS allocated_security_mismatch_count
                      FROM strategy_lab.run_order o
                      JOIN strategy_lab.experiment_run r ON r.run_id = o.run_id
                      JOIN sell_trace s ON s.run_id = o.run_id AND s.order_id = o.order_id
                      WHERE o.side = 'SELL' AND o.trade_id IS NULL
                      GROUP BY r.strategy_commit, r.backtest_commit
                    ) q
                  ),
                  'order_signal_mismatch_by_version', (
                    SELECT COALESCE(jsonb_agg(to_jsonb(q)), '[]'::jsonb)
                    FROM (
                      SELECT COALESCE(r.strategy_commit, 'unknown') AS strategy_commit,
                             COALESCE(r.backtest_commit, 'unknown') AS backtest_commit,
                             o.side,
                             count(*) FILTER (
                               WHERE o.signal_id IS NOT NULL AND s.signal_id IS NULL
                             )::bigint AS dangling_signal_reference_count,
                             count(*) FILTER (
                               WHERE s.signal_id IS NOT NULL
                                 AND (o.exchange IS DISTINCT FROM s.exchange
                                   OR o.canonical_id IS DISTINCT FROM s.canonical_id)
                             )::bigint AS security_mismatch_count
                      FROM strategy_lab.run_order o
                      JOIN strategy_lab.experiment_run r ON r.run_id = o.run_id
                      LEFT JOIN strategy_lab.run_signal s
                        ON s.run_id = o.run_id AND s.signal_id = o.signal_id
                      WHERE o.signal_id IS NOT NULL
                      GROUP BY r.strategy_commit, r.backtest_commit, o.side
                    ) q
                  ),
                  'allocation_security_mismatch_by_version', (
                    SELECT COALESCE(jsonb_agg(to_jsonb(q)), '[]'::jsonb)
                    FROM (
                      SELECT COALESCE(r.strategy_commit, 'unknown') AS strategy_commit,
                             COALESCE(r.backtest_commit, 'unknown') AS backtest_commit,
                             a.allocation_role,
                             count(*) FILTER (
                               WHERE t.exchange IS DISTINCT FROM o.exchange
                                  OR t.canonical_id IS DISTINCT FROM o.canonical_id
                             )::bigint AS security_mismatch_count,
                             count(*)::bigint AS allocation_count
                      FROM strategy_lab.run_trade_fill a
                      JOIN strategy_lab.run_trade t
                        ON t.run_id = a.run_id AND t.trade_id = a.trade_id
                      JOIN strategy_lab.run_fill f
                        ON f.run_id = a.run_id AND f.fill_id = a.fill_id
                      JOIN strategy_lab.run_order o
                        ON o.run_id = f.run_id AND o.order_id = f.order_id
                      JOIN strategy_lab.experiment_run r ON r.run_id = a.run_id
                      GROUP BY r.strategy_commit, r.backtest_commit, a.allocation_role
                    ) q
                  ),
                  'exit_event_by_version', (
                    WITH event_trace AS (
                      SELECT e.run_id, e.exit_event_id, e.status, e.reason, e.decision_date,
                             count(o.order_id) FILTER (WHERE o.side = 'SELL')::bigint AS sell_order_count,
                             count(o.order_id) FILTER (
                               WHERE o.side = 'SELL' AND o.trade_id IS DISTINCT FROM e.trade_id
                             )::bigint AS sell_order_trade_mismatch_count,
                             count(o.order_id) FILTER (
                               WHERE o.side = 'SELL' AND o.decision_reason IS DISTINCT FROM e.reason
                             )::bigint AS sell_order_reason_mismatch_count,
                             min(o.decision_date) FILTER (WHERE o.side = 'SELL') AS first_sell_decision_date,
                             COALESCE(sum(o.filled_qty) FILTER (WHERE o.side = 'SELL'), 0)::bigint AS sell_filled_qty
                      FROM strategy_lab.run_exit_event e
                      LEFT JOIN strategy_lab.run_order o
                        ON o.run_id = e.run_id AND o.exit_event_id = e.exit_event_id
                      GROUP BY e.run_id, e.exit_event_id, e.status, e.reason, e.decision_date
                    )
                    SELECT COALESCE(jsonb_agg(to_jsonb(q)), '[]'::jsonb)
                    FROM (
                      SELECT COALESCE(r.strategy_commit, 'unknown') AS strategy_commit,
                             COALESCE(r.backtest_commit, 'unknown') AS backtest_commit,
                             e.status,
                             count(*)::bigint AS exit_event_count,
                             count(*) FILTER (WHERE e.sell_order_count = 0)::bigint AS without_sell_order_count,
                             sum(e.sell_order_trade_mismatch_count)::bigint AS sell_order_trade_mismatch_count,
                             sum(e.sell_order_reason_mismatch_count)::bigint AS sell_order_reason_mismatch_count,
                             count(*) FILTER (
                               WHERE e.first_sell_decision_date IS NOT NULL
                                 AND to_char(e.first_sell_decision_date, 'YYYYMMDD')::integer
                                     <> e.decision_date
                             )::bigint AS first_sell_decision_date_mismatch_count,
                             count(*) FILTER (
                               WHERE e.status = 'complete' AND e.sell_filled_qty = 0
                             )::bigint AS complete_without_sell_fill_count,
                             count(*) FILTER (
                               WHERE e.status = 'abandoned' AND e.sell_filled_qty > 0
                             )::bigint AS abandoned_with_partial_or_prior_fill_count
                      FROM event_trace e
                      JOIN strategy_lab.experiment_run r ON r.run_id = e.run_id
                      GROUP BY r.strategy_commit, r.backtest_commit, e.status
                    ) q
                  )
                ) INTO diagnostics_report;

                RAISE NOTICE 'STRATEGY_LAB_DIAGNOSTICS=%', diagnostics_report::text;
              END
              $strategy_lab_diagnostic_slices$;

              COMMIT;
              """

              audit_result = subprocess.run(
                  [
                      "psql", "-X", "-w", "-v", "ON_ERROR_STOP=1",
                      "-h", "127.0.0.1", "-p", "15432",
                      "-U", values["pg_user"], "-d", values["pg_db"],
                      "-Atc", "SELECT 1;\n" + audit_sql,
                  ],
                  env=pg_env,
                  check=False,
                  capture_output=True,
                  text=True,
                  timeout=40,
              )
              if audit_result.returncode != 0:
                  detail = (audit_result.stderr or "").strip()
                  print(
                      "FAIL: Strategy Lab audit SQL exited with code "
                      + str(audit_result.returncode)
                  )
                  if detail:
                      print("PostgreSQL audit error:")
                      print(detail[-6000:])
                  raise SystemExit("FAIL: Strategy Lab audit SQL execution failed")
              audit_lines = [
                  line.strip() for line in audit_result.stdout.splitlines() if line.strip()
              ]
              if not audit_lines or audit_lines[0] != "1":
                  raise SystemExit("FAIL: PostgreSQL session health check returned an unexpected result")
              try:
                  json_start = audit_result.stdout.find("{")
                  if json_start < 0:
                      raise ValueError("JSON object not found in psql output")
                  audit_report, _json_end = json.JSONDecoder().raw_decode(
                      audit_result.stdout[json_start:]
                  )
              except Exception as exc:
                  raise SystemExit("FAIL: Strategy Lab audit returned invalid JSON") from exc

              exact_counts_marker = "STRATEGY_LAB_EXACT_TABLE_COUNTS="
              notice_output = "\n".join([
                  audit_result.stdout or "",
                  audit_result.stderr or "",
              ])
              exact_count_lines = [
                  line for line in notice_output.splitlines()
                  if exact_counts_marker in line
              ]
              if len(exact_count_lines) != 1:
                  raise SystemExit(
                      "FAIL: Strategy Lab exact table counts were not emitted exactly once"
                  )
              try:
                  exact_count_payload = exact_count_lines[0].split(
                      exact_counts_marker, 1
                  )[1].strip()
                  audit_report["exact_table_counts"] = json.loads(exact_count_payload)
              except Exception as exc:
                  raise SystemExit(
                      "FAIL: Strategy Lab exact table counts were invalid JSON"
                  ) from exc

              if not isinstance(audit_report["exact_table_counts"], list):
                  raise SystemExit("FAIL: Strategy Lab exact table counts must be a list")

              consistency_marker = "STRATEGY_LAB_CONSISTENCY="
              consistency_lines = [
                  line for line in notice_output.splitlines()
                  if consistency_marker in line
              ]
              if len(consistency_lines) != 1:
                  raise SystemExit(
                      "FAIL: Strategy Lab consistency audit was not emitted exactly once"
                  )
              try:
                  consistency_payload = consistency_lines[0].split(
                      consistency_marker, 1
                  )[1].strip()
                  audit_report["consistency_audit"] = json.loads(consistency_payload)
              except Exception as exc:
                  raise SystemExit(
                      "FAIL: Strategy Lab consistency audit was invalid JSON"
                  ) from exc
              if audit_report["consistency_audit"].get("schema_version") != 1:
                  raise SystemExit("FAIL: Strategy Lab consistency audit version mismatch")

              diagnostics_marker = "STRATEGY_LAB_DIAGNOSTICS="
              diagnostics_lines = [
                  line for line in notice_output.splitlines()
                  if diagnostics_marker in line
              ]
              if len(diagnostics_lines) != 1:
                  raise SystemExit(
                      "FAIL: Strategy Lab diagnostic slices were not emitted exactly once"
                  )
              try:
                  diagnostics_payload = diagnostics_lines[0].split(
                      diagnostics_marker, 1
                  )[1].strip()
                  audit_report["diagnostic_slices"] = json.loads(diagnostics_payload)
              except Exception as exc:
                  raise SystemExit(
                      "FAIL: Strategy Lab diagnostic slices were invalid JSON"
                  ) from exc
              if audit_report["diagnostic_slices"].get("schema_version") != 1:
                  raise SystemExit("FAIL: Strategy Lab diagnostic slices version mismatch")
              if not isinstance(audit_report["consistency_audit"].get("checks"), dict):
                  raise SystemExit("FAIL: Strategy Lab consistency checks must be an object")

              if audit_report.get("database") != "nooshare_dev":
                  raise SystemExit("FAIL: Strategy Lab audit database guard mismatch")
              if audit_report.get("transaction_read_only") != "on":
                  raise SystemExit("FAIL: Strategy Lab audit was not read-only")

              audit_path = Path(os.environ["RUNNER_TEMP"]) / "strategy-lab-readonly-audit.json"
              audit_path.write_text(
                  json.dumps(audit_report, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )
              table_count = len(audit_report.get("tables", []))
              exact_count_tables = len(audit_report.get("exact_table_counts", []))
              consistency_checks = audit_report["consistency_audit"]["checks"]
              print(f"Strategy Lab consistency checks emitted: {len(consistency_checks)}")
              print(f"Orders with dangling exit event: {consistency_checks.get('orders_with_dangling_exit_event')}")
              print(f"Order/fill quantity mismatches: {consistency_checks.get('orders_filled_qty_vs_fill_sum_mismatch')}")
              print(f"Fill allocation under/over-count: {consistency_checks.get('fills_underallocated_qty')}/{consistency_checks.get('fills_overallocated_qty')}")
              print(f"Trade entry/exit allocation mismatches: {consistency_checks.get('trade_entry_qty_vs_allocations_mismatch')}/{consistency_checks.get('trade_exit_qty_vs_allocations_mismatch')}")
              print(f"Run summary count mismatches: {consistency_checks.get('run_summary_count_mismatch')}")
              print("Strategy Lab DEV metadata audit: PASS (read-only)")
              print(f"Strategy Lab tables discovered: {table_count}")
              print(f"Strategy Lab exact table counts: {exact_count_tables}")
              print(f"Current DB role superuser: {audit_report.get('role_privileges', {}).get('superuser')}")
              print(f"Strategy Lab schema CREATE privilege: {audit_report.get('strategy_lab_schema_privileges', {}).get('create') if audit_report.get('strategy_lab_schema_privileges') else None}")

              print("CI Infrastructure Tunnel: CONNECTED")
              print("PostgreSQL: PASS (SELECT 1; no business rows read)")
              print("RustFS: PASS (HeadBucket; no object listing or writes)")
          finally:
              if pid_path.is_file():
                  try:
                      os.kill(int(pid_path.read_text(encoding="utf-8").strip()), signal.SIGTERM)
                  except (ProcessLookupError, ValueError, OSError):
                      pass
              shutil.rmtree(work_dir, ignore_errors=True)
          PY

      - name: Upload read-only Strategy Lab audit
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-readonly-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/strategy-lab-readonly-audit.json
          if-no-files-found: error
          retention-days: 3


  workspace_source_export:
    name: Workspace Source Export
    needs: validate_dispatch_request
    if: >-
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.workspace_source_export == true) ||
        (needs.validate_dispatch_request.result == 'success' && needs.validate_dispatch_request.outputs.workspace_source_export == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'issue_comment' && needs.validate_dispatch_request.result == 'success' && needs.validate_dispatch_request.outputs.workspace_source_ref != '') && needs.validate_dispatch_request.outputs.workspace_source_ref || inputs.workspace_source_ref || github.sha }}
          fetch-depth: 0

      - name: Package tracked source, tests and fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          records = []
          excluded = []
          max_file_bytes = 50 * 1024 * 1024

          excluded_segments = {
              ".git", ".venv", "venv", "__pycache__", ".pytest_cache",
              ".mypy_cache", ".ruff_cache", ".runtime", ".generated",
              ".cache", "node_modules",
          }
          third_party_binary_dirs = {
              "third_party/bin", "third_party/binaries",
              "third-party/bin", "third-party/binaries",
              "offline-binaries", "offline-third-party",
          }
          tdx_raw_dirs = {
              "tdx/raw", "tdx/raw_data", "tdx/raw-data",
              "data/tdx/raw", "data/tdx/raw_data", "data/tdx/raw-data",
          }

          entries = subprocess.check_output(
              ["git", "ls-files", "-s", "-z"]
          ).split(b"\0")

          for entry in entries:
              if not entry:
                  continue
              metadata, raw_path = entry.split(b"\t", 1)
              mode, _blob, _stage = metadata.decode("ascii").split()
              path = raw_path.decode("utf-8", errors="strict")
              rel = PurePosixPath(path)
              parts = tuple(part.lower() for part in rel.parts)
              reason = None

              if mode == "160000":
                  reason = "git-submodule-pointer"
              elif any(part in excluded_segments for part in parts):
                  reason = "generated-or-dependency-directory"
              elif any(
                  "/".join(parts[i:i + 2]) in third_party_binary_dirs
                  for i in range(max(0, len(parts) - 1))
              ):
                  reason = "offline-third-party-binary"
              elif any(
                  "/".join(parts[i:i + 2]) in tdx_raw_dirs
                  for i in range(max(0, len(parts) - 1))
              ):
                  reason = "tdx-raw-data"

              source = root.joinpath(*rel.parts)
              if reason is None and not source.is_file():
                  reason = "not-a-regular-file"
              if reason is None and source.stat().st_size > max_file_bytes:
                  reason = "file-over-50-mib"

              if reason:
                  excluded.append({"path": path, "reason": reason})
                  continue

              data = source.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              file_mode = 0o755 if mode.endswith("755") else 0o644
              records.append({
                  "path": path,
                  "size": len(data),
                  "sha256": digest,
                  "mode": oct(file_mode),
              })

          records.sort(key=lambda item: item["path"])
          excluded.sort(key=lambda item: item["path"])
          manifest = {
              "schema_version": 1,
              "repository": repository,
              "commit": commit,
              "file_count": len(records),
              "fixture_file_count": sum(
                  1 for item in records
                  if any(
                      marker in part.lower()
                      for part in PurePosixPath(item["path"]).parts
                      for marker in ("test", "fixture", "sample")
                  )
              ),
              "files": records,
              "excluded_file_count": len(excluded),
              "excluded": excluded,
              "exclusion_policy": {
                  "max_file_bytes": max_file_bytes,
                  "purpose": "exclude generated dependencies, offline third-party binaries and large raw assets while retaining tracked tests and fixtures",
              },
          }
          manifest_bytes = json.dumps(
              manifest, ensure_ascii=False, sort_keys=True, indent=2
          ).encode("utf-8")

          output_dir = Path(os.environ["RUNNER_TEMP"])
          archive_path = output_dir / "workspace-source.tar.gz"
          manifest_path = output_dir / "workspace-source-manifest.json"

          with tarfile.open(archive_path, "w:gz", compresslevel=6) as archive:
              for item in records:
                  data = root.joinpath(*PurePosixPath(item["path"]).parts).read_bytes()
                  info = tarfile.TarInfo(item["path"])
                  info.size = len(data)
                  info.mode = int(item["mode"], 8)
                  info.mtime = 0
                  archive.addfile(info, io.BytesIO(data))

              info = tarfile.TarInfo("WORKSPACE-MANIFEST.json")
              info.size = len(manifest_bytes)
              info.mode = 0o644
              info.mtime = 0
              archive.addfile(info, io.BytesIO(manifest_bytes))

          manifest_path.write_bytes(manifest_bytes)
          archive_hash = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          print(json.dumps({
              "status": "EXPORTED",
              "repository": repository,
              "commit": commit,
              "files": len(records),
              "fixture_files": manifest["fixture_file_count"],
              "excluded": len(excluded),
              "archive_bytes": archive_path.stat().st_size,
              "archive_sha256": archive_hash,
          }, sort_keys=True))
          PY

      - name: Upload exact source artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workspace-source.tar.gz
            ${{ runner.temp }}/workspace-source-manifest.json
          if-no-files-found: error
          retention-days: 3

  workspace_artifact_materialization:
    name: Workspace Artifact Materialization
    needs: workspace_source_export
    if: always() && needs.workspace_source_export.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: workspace-source-${{ github.run_id }}
          path: ${{ runner.temp }}/workspace-source-artifact

      - name: Materialize and verify Python workspace snapshot
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path, PurePosixPath

          artifact_dir = Path("${{ runner.temp }}") / "workspace-source-artifact"
          archive_path = artifact_dir / "workspace-source.tar.gz"
          manifest_path = artifact_dir / "workspace-source-manifest.json"
          destination = Path("${{ runner.temp }}") / "materialized-python-workspace"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          destination.mkdir(parents=True, exist_ok=True)

          with tarfile.open(archive_path, "r:gz") as archive:
              members = {member.name: member for member in archive.getmembers()}
              embedded = members.get("WORKSPACE-MANIFEST.json")
              if embedded is None or not embedded.isfile():
                  raise SystemExit("materialization failed: embedded manifest missing")
              embedded_manifest = archive.extractfile(embedded).read()
              if embedded_manifest != manifest_path.read_bytes():
                  raise SystemExit("materialization failed: manifest mismatch")

              for item in manifest["files"]:
                  path = PurePosixPath(item["path"])
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("materialization failed: unsafe archive path")
                  member = members.get(item["path"])
                  if member is None or not member.isfile():
                      raise SystemExit("materialization failed: source member missing")
                  data = archive.extractfile(member).read()
                  if len(data) != item["size"]:
                      raise SystemExit("materialization failed: file size mismatch")
                  if hashlib.sha256(data).hexdigest() != item["sha256"]:
                      raise SystemExit("materialization failed: file hash mismatch")

                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(int(item["mode"], 8))

          materialized_count = sum(
              1 for path in destination.rglob("*") if path.is_file()
          )
          if materialized_count != manifest["file_count"]:
              raise SystemExit("materialization failed: file count mismatch")

          print(json.dumps({
              "status": "MATERIALIZED_AND_VERIFIED",
              "repository": manifest["repository"],
              "commit": manifest["commit"],
              "files": materialized_count,
              "fixture_files": manifest["fixture_file_count"],
          }, sort_keys=True))
          PY
