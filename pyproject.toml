[project]
name = "nooshare-indicators"
version = "0.1.0"
description = "A-share daily technical indicator computation engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.9",
    "tqdm>=4.65",
    "tabulate>=0.9",
]

[project.optional-dependencies]
validate = ["TA-Lib>=0.4.28"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
indicators = "nooshare_indicators.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nooshare_indicators"]

[tool.ruff]
line-length = 100
target-version = "py310"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
